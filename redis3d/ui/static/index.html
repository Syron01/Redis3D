<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redis3D Pro Studio</title>
  <style>
    :root {
      --bg-outer: #E7E6E2;
      --dark-panel: #1C1C1B;
      --dark-card: #252523;
      --dark-track: #2D2D2B;
      --dark-thumb: #4B4A47;
      --cream-card: #EFECE6;
      --stage-card: #F6F4EF;
      --cream-track: #E5E1D9;
      --ink-dark: #1C1C1B;
      --ink-muted: #76726A;
      --ink-light: #F3F0EA;
      --ink-light-muted: rgba(243, 240, 234, 0.56);
      --border-dark: rgba(255, 255, 255, 0.08);
      --border-light: rgba(28, 28, 27, 0.08);
      --shadow-soft: 0 20px 50px -14px rgba(20, 20, 19, 0.14);
      --shadow-pill: 0 2px 8px rgba(20, 20, 19, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg-outer);
      color: var(--ink-dark);
      overflow: hidden;
    }

    /* Full-Screen 3D Studio Layout (Tripo / Meshy Architecture) */
    .studio {
      height: 100vh;
      width: 100vw;
      padding: 14px;
      display: grid;
      grid-template-columns: 344px minmax(0, 1fr);
      gap: 14px;
    }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .studio {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
      }
      .viewport-card { min-height: 520px; }
    }

    /* ============================================================
       SOL KONTROL PANELİ (#1C1C1B + #EFECE6 Alt Kart)
       Dış R = 30px, Alt Kart Margin P = 8px => İç R = 22px
       ============================================================ */
    .sidebar {
      background: var(--dark-panel);
      border-radius: 30px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .sidebar-top {
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink-light);
    }

    /* Minimal Pro Pill Toggle */
    .pro-pill {
      width: 58px;
      height: 28px;
      border-radius: 9999px;
      background: var(--dark-track);
      border: 1px solid var(--border-dark);
      padding: 2px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .pro-dot {
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      background: var(--dark-thumb);
      color: var(--ink-light);
      font-size: 9px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateX(30px);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s;
    }
    .pro-pill[data-pro="false"] .pro-dot {
      transform: translateX(0);
      background: #333330;
      color: var(--ink-light-muted);
    }

    /* Metinden / Görselden Sekme Kapsülü */
    .mode-track {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--dark-track);
      padding: 3px;
      border-radius: 9999px;
      border: 1px solid var(--border-dark);
    }
    .mode-tab {
      height: 34px;
      border: none;
      background: transparent;
      color: var(--ink-light-muted);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .mode-tab.active {
      background: var(--dark-thumb);
      color: var(--ink-light);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    /* Ana Girdi Alanı */
    .input-pane {
      display: none;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }
    .input-pane.active {
      display: flex;
    }

    .prompt-box {
      width: 100%;
      flex: 1;
      min-height: 128px;
      background: var(--dark-card);
      border: 1px solid var(--border-dark);
      border-radius: 18px;
      padding: 14px;
      color: var(--ink-light);
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.16s;
    }
    .prompt-box:focus {
      border-color: rgba(243, 240, 234, 0.28);
    }
    .prompt-box::placeholder {
      color: rgba(243, 240, 234, 0.34);
    }

    /* Görsel Sürükle & Bırak Alanı */
    .drop-zone {
      position: relative;
      flex: 1;
      min-height: 150px;
      background: var(--dark-card);
      border: 1.5px dashed rgba(243, 240, 234, 0.18);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      color: var(--ink-light-muted);
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.16s, background 0.16s;
    }
    .drop-zone:hover {
      border-color: rgba(243, 240, 234, 0.38);
      background: #2A2A27;
    }
    .drop-zone img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .drop-zone.has-image img {
      display: block;
    }
    .clear-img-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      border: none;
      background: rgba(28, 28, 27, 0.8);
      color: var(--ink-light);
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .drop-zone.has-image .clear-img-btn {
      display: inline-flex;
    }

    .rig-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 6px 2px;
      font-size: 12.5px;
      color: var(--ink-light-muted);
    }

    .mini-switch {
      width: 42px;
      height: 24px;
      border-radius: 9999px;
      background: var(--dark-track);
      border: 1px solid var(--border-dark);
      padding: 2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .mini-switch span {
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: var(--ink-light);
      transform: translateX(18px);
      transition: transform 0.2s ease, opacity 0.2s;
    }
    .mini-switch[data-on="false"] span {
      transform: translateX(0);
      opacity: 0.45;
    }

    /* ============================================================
       ALT SICAK YULAF KREM KART (#EFECE6, R_iç = 22px)
       ============================================================ */
    .cream-card {
      background: var(--cream-card);
      border-radius: 22px;
      padding: 18px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .metric-btn {
      background: transparent;
      border: none;
      border-radius: 14px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.14s;
    }
    .metric-btn:hover {
      background: rgba(28, 28, 27, 0.05);
    }
    .metric-val {
      display: inline-flex;
      align-items: flex-start;
      line-height: 1;
      color: var(--ink-dark);
    }
    .metric-val strong {
      font-size: 25px;
      font-weight: 500;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .metric-val sub, .metric-val sup {
      font-size: 11px;
      color: var(--ink-muted);
      margin-left: 2px;
      margin-top: 2px;
    }
    .metric-lbl {
      font-size: 11.5px;
      color: var(--ink-muted);
    }

    .cta-row {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .cand-pill {
      height: 48px;
      background: var(--dark-panel);
      border-radius: 9999px;
      padding: 4px 8px 4px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cand-badge {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      background: var(--dark-thumb);
      color: var(--ink-light);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }
    .cand-steps {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .cand-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 9999px;
      background: transparent;
      color: var(--ink-light-muted);
      font-size: 17px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cand-btn:hover {
      color: var(--ink-light);
      background: rgba(255, 255, 255, 0.08);
    }

    .generate-pill {
      height: 48px;
      border: none;
      border-radius: 9999px;
      background: var(--dark-panel);
      color: var(--ink-light);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.16s ease, opacity 0.16s ease;
    }
    .generate-pill:hover {
      background: #2C2C2A;
    }
    .generate-pill:active {
      transform: scale(0.975);
    }
    .generate-pill:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    /* ============================================================
       SAĞ TAM EKRAN 3D SAHNE (ÜZERİNDE HİÇBİR ETİKET / KALABALIK YOK)
       Dış R = 30px, Padding P = 10px => Sahne R = 20px
       ============================================================ */
    .viewport-card {
      background: var(--stage-card);
      border-radius: 30px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-soft);
      min-height: 0;
    }

    .stage-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 4px;
    }

    .view-pills {
      display: inline-flex;
      background: var(--cream-track);
      padding: 3px;
      border-radius: 9999px;
      gap: 2px;
    }
    .view-pill {
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .view-pill.active {
      background: #FFFFFF;
      color: var(--ink-dark);
      font-weight: 600;
      box-shadow: var(--shadow-pill);
    }

    .stage-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-line {
      font-size: 12px;
      color: var(--ink-muted);
      padding: 0 6px;
      font-variant-numeric: tabular-nums;
    }

    .pill-btn-light {
      height: 38px;
      padding: 0 15px;
      border-radius: 9999px;
      border: 1px solid var(--border-light);
      background: #FFFFFF;
      color: var(--ink-dark);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill-btn-light:hover {
      background: var(--cream-card);
    }

    .pill-btn-dark {
      height: 38px;
      padding: 0 18px;
      border-radius: 9999px;
      border: none;
      background: var(--dark-panel);
      color: var(--ink-light);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill-btn-dark:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Saf 3D Kanvas — Üzerinde sıfır yazı / rozet */
    .stage-canvas-wrap {
      flex: 1;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 45%, #282725 0%, #191918 85%);
      overflow: hidden;
      min-height: 0;
    }

    #viewport {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div class="studio">
    <!-- SOL STÜDYO KONTROLÜ -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand-row">
          <span class="brand-name">Redis3D</span>
          <button class="pro-pill" id="proToggle" data-pro="true" title="Pro Kalite Modu">
            <span class="pro-dot">Pro</span>
          </button>
        </div>

        <div class="mode-track" role="tablist">
          <button class="mode-tab active" data-tab="text">Metinden 3D</button>
          <button class="mode-tab" data-tab="image">Görselden 3D</button>
        </div>

        <div class="input-pane active" id="tab-text">
          <textarea class="prompt-box" id="prompt" placeholder="Üretmek istediğiniz 3D nesneyi yazın...">keskin hatlı zırhlı robot kaskı</textarea>
        </div>

        <div class="input-pane" id="tab-image">
          <div class="drop-zone" id="dropZone">
            <img id="previewImg" alt="Referans Görsel" />
            <button class="clear-img-btn" id="clearImgBtn" type="button">&times;</button>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span style="font-size:13px;font-weight:500;">Fotoğraf Seç veya Sürükle</span>
            <span style="font-size:11px;opacity:0.6;">PNG, JPG, WEBP</span>
            <input type="file" id="imageFile" accept="image/*" hidden />
          </div>
        </div>

        <div class="rig-row">
          <span>Otomatik İskelet (Rig)</span>
          <button class="mini-switch" id="rigSwitch" data-on="true" aria-label="Otomatik İskelet">
            <span></span>
          </button>
        </div>
      </div>

      <!-- ALT KREM AKSİYON KARTI -->
      <div class="cream-card">
        <div class="metrics-row">
          <button class="metric-btn" id="quadsBtn" type="button">
            <span class="metric-val"><strong id="quadsVal">512</strong><sup>q</sup></span>
            <span class="metric-lbl">Poligon</span>
          </button>
          <button class="metric-btn" id="stepsBtn" type="button">
            <span class="metric-val"><strong id="stepsVal">1</strong><sup>x</sup></span>
            <span class="metric-lbl">Adım Hızı</span>
          </button>
        </div>

        <div class="cta-row">
          <div class="cand-pill" title="Aday Sayısı">
            <span class="cand-badge" id="candBadge">4x</span>
            <div class="cand-steps">
              <button class="cand-btn" id="candMinus" type="button">&minus;</button>
              <button class="cand-btn" id="candPlus" type="button">+</button>
            </div>
          </div>
          <button class="generate-pill" id="genBtn" type="button">Oluştur</button>
        </div>
      </div>
    </aside>

    <!-- SAĞ SAF 3D SAHNE -->
    <main class="viewport-card">
      <div class="stage-toolbar">
        <div class="view-pills">
          <button class="view-pill active" data-mode="pbr" id="modePbr">Doku</button>
          <button class="view-pill" data-mode="wire" id="modeWire">Tel Kafes</button>
          <button class="view-pill" data-mode="uv" id="modeUv">UV</button>
          <button class="view-pill" data-mode="bone" id="modeBone">İskelet</button>
          <button class="view-pill" data-mode="print" id="modePrint">3D Baskı</button>
        </div>

        <div class="stage-actions">
          <span class="status-line" id="status">Hazır</span>
          <button class="pill-btn-light" id="spinBtn" type="button">Döndür</button>
          <button class="pill-btn-dark" id="downloadBtn" type="button" disabled>İndir (.GLB)</button>
        </div>
      </div>

      <div class="stage-canvas-wrap">
        <canvas id="viewport"></canvas>
      </div>
    </main>
  </div>

  <script>
    const state = {
      candidates: 4,
      nfeSteps: 1,
      retopoQuads: 512,
      autoRig: true,
      proMode: true,
      imageB64: null,
      inspectorMode: "pbr",
      turntable: true,
      lastGlbBlob: null,
      mesh: null,
      rotY: 0.55,
      rotX: 0.30,
      zoom: 1.85,
      dragging: false,
      lastPt: { x: 0, y: 0 },
    };

    const QUADS = [256, 512, 1024, 2048];
    const STEPS = [1, 2, 4];

    // Sekme geçişi (Metinden 3D / Görselden 3D)
    document.querySelectorAll(".mode-tab").forEach((tab) => {
      tab.onclick = () => {
        document.querySelectorAll(".mode-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        document.querySelectorAll(".input-pane").forEach((p) => p.classList.remove("active"));
        document.getElementById(`tab-${tab.dataset.tab}`).classList.add("active");
      };
    });

    // Pro & Oto İskelet anahtarları
    const proToggle = document.getElementById("proToggle");
    proToggle.onclick = () => {
      state.proMode = !state.proMode;
      proToggle.dataset.pro = String(state.proMode);
    };

    const rigSwitch = document.getElementById("rigSwitch");
    rigSwitch.onclick = () => {
      state.autoRig = !state.autoRig;
      rigSwitch.dataset.on = String(state.autoRig);
    };

    // Metrikler
    document.getElementById("quadsBtn").onclick = () => {
      state.retopoQuads = QUADS[(QUADS.indexOf(state.retopoQuads) + 1) % QUADS.length];
      document.getElementById("quadsVal").textContent = state.retopoQuads;
    };
    document.getElementById("stepsBtn").onclick = () => {
      state.nfeSteps = STEPS[(STEPS.indexOf(state.nfeSteps) + 1) % STEPS.length];
      document.getElementById("stepsVal").textContent = state.nfeSteps;
    };

    // Aday sayacı
    document.getElementById("candMinus").onclick = () => {
      state.candidates = Math.max(1, state.candidates - 1);
      document.getElementById("candBadge").textContent = `${state.candidates}x`;
    };
    document.getElementById("candPlus").onclick = () => {
      state.candidates = Math.min(8, state.candidates + 1);
      document.getElementById("candBadge").textContent = `${state.candidates}x`;
    };

    // Görünüm modları
    document.querySelectorAll(".view-pill").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll(".view-pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.inspectorMode = btn.dataset.mode;
      };
    });

    document.getElementById("spinBtn").onclick = () => {
      state.turntable = !state.turntable;
      document.getElementById("spinBtn").style.opacity = state.turntable ? "1" : "0.55";
    };

    // Fotoğraf yükleme
    const dropZone = document.getElementById("dropZone");
    const imageFile = document.getElementById("imageFile");
    const previewImg = document.getElementById("previewImg");

    function loadImgFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const res = String(reader.result || "");
        state.imageB64 = res.includes(",") ? res.split(",")[1] : res;
        previewImg.src = res;
        dropZone.classList.add("has-image");
      };
      reader.readAsDataURL(file);
    }

    dropZone.onclick = (e) => {
      if (e.target.id === "clearImgBtn") return;
      imageFile.click();
    };
    imageFile.onchange = (e) => loadImgFile(e.target.files?.[0]);
    dropZone.ondragover = (e) => e.preventDefault();
    dropZone.ondrop = (e) => {
      e.preventDefault();
      loadImgFile(e.dataTransfer?.files?.[0]);
    };
    document.getElementById("clearImgBtn").onclick = (e) => {
      e.stopPropagation();
      state.imageB64 = null;
      previewImg.src = "";
      imageFile.value = "";
      dropZone.classList.remove("has-image");
    };

    // GLB Çözücü
    function parseGlbBuffer(buffer) {
      const view = new DataView(buffer);
      if (view.getUint32(0, true) !== 0x46546C67) return null;
      const jsonLen = view.getUint32(12, true);
      const gltf = JSON.parse(new TextDecoder().decode(new Uint8Array(buffer, 20, jsonLen)));
      const binOffset = 20 + jsonLen + 8;
      const prim = gltf.meshes?.[0]?.primitives?.[0];
      if (!prim) return null;

      function readAcc(idx) {
        const acc = gltf.accessors[idx];
        const bv = gltf.bufferViews[acc.bufferView];
        const off = binOffset + (bv.byteOffset || 0) + (acc.byteOffset || 0);
        const k = acc.type === "VEC3" ? 3 : acc.type === "VEC2" ? 2 : acc.type === "VEC4" ? 4 : 1;
        const n = acc.count * k;
        if (acc.componentType === 5126) return new Float32Array(buffer, off, n);
        if (acc.componentType === 5125) return new Uint32Array(buffer, off, n);
        if (acc.componentType === 5123) return new Uint16Array(buffer, off, n);
        return null;
      }

      const pos = readAcc(prim.attributes.POSITION);
      const idx = prim.indices !== undefined ? readAcc(prim.indices) : null;
      const nVerts = pos.length / 3;
      let cx = 0, cy = 0, cz = 0;
      for (let i = 0; i < nVerts; i++) {
        cx += pos[i * 3]; cy += pos[i * 3 + 1]; cz += pos[i * 3 + 2];
      }
      cx /= Math.max(1, nVerts); cy /= Math.max(1, nVerts); cz /= Math.max(1, nVerts);
      let maxR = 1e-5;
      for (let i = 0; i < nVerts; i++) {
        maxR = Math.max(maxR, Math.hypot(pos[i * 3] - cx, pos[i * 3 + 1] - cy, pos[i * 3 + 2] - cz));
      }
      const normPos = new Float32Array(pos.length);
      for (let i = 0; i < nVerts; i++) {
        normPos[i * 3] = (pos[i * 3] - cx) / maxR;
        normPos[i * 3 + 1] = (pos[i * 3 + 1] - cy) / maxR;
        normPos[i * 3 + 2] = (pos[i * 3 + 2] - cz) / maxR;
      }
      const faces = [];
      if (idx) {
        for (let i = 0; i < idx.length; i += 3) faces.push([idx[i], idx[i + 1], idx[i + 2]]);
      } else {
        for (let i = 0; i < nVerts; i += 3) faces.push([i, i + 1, i + 2]);
      }
      return { pos: normPos, faces, vertsCount: nVerts };
    }

    function buildStarterMesh() {
      const phi = (1 + Math.sqrt(5)) / 2;
      const rawV = [
        [-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0],
        [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi],
        [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1],
      ].map((v) => { const l = Math.hypot(...v); return [v[0] / l, v[1] / l, v[2] / l]; });
      const rawF = [
        [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
        [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
        [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
        [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1],
      ];
      const cache = new Map();
      const mid = (a, b) => {
        const k = a < b ? `${a}_${b}` : `${b}_${a}`;
        if (cache.has(k)) return cache.get(k);
        const m = [0.5*(rawV[a][0]+rawV[b][0]), 0.5*(rawV[a][1]+rawV[b][1]), 0.5*(rawV[a][2]+rawV[b][2])];
        const l = Math.hypot(...m);
        const idx = rawV.length;
        rawV.push([m[0] / l, m[1] / l, m[2] / l]);
        cache.set(k, idx);
        return idx;
      };
      const faces = [];
      for (const [a, b, c] of rawF) {
        const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
        faces.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
      }
      return { pos: new Float32Array(rawV.flat()), faces, vertsCount: rawV.length };
    }

    state.mesh = buildStarterMesh();

    // 3D Çizim Döngüsü
    const canvas = document.getElementById("viewport");
    const ctx = canvas.getContext("2d");

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const r = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(r.width * dpr));
      canvas.height = Math.max(1, Math.floor(r.height * dpr));
    }
    window.addEventListener("resize", resize);
    resize();

    canvas.addEventListener("pointerdown", (e) => {
      state.dragging = true;
      state.lastPt = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener("pointermove", (e) => {
      if (!state.dragging) return;
      state.rotY += (e.clientX - state.lastPt.x) * 0.008;
      state.rotX = Math.max(-1.4, Math.min(1.4, state.rotX + (e.clientY - state.lastPt.y) * 0.008));
      state.lastPt = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener("pointerup", () => { state.dragging = false; });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      state.zoom = Math.max(1.15, Math.min(4.2, state.zoom + e.deltaY * 0.0014));
    }, { passive: false });

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (state.turntable && !state.dragging) state.rotY += 0.004;

      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w * 0.5, cy = h * 0.5;
      const scale = Math.min(w, h) * 0.34 * state.zoom;
      const cosY = Math.cos(state.rotY), sinY = Math.sin(state.rotY);
      const cosX = Math.cos(state.rotX), sinX = Math.sin(state.rotX);

      function proj(x, y, z) {
        const x1 = x * cosY - z * sinY;
        const z1 = x * sinY + z * cosY;
        const y2 = y * cosX - z1 * sinX;
        const z2 = y * sinX + z1 * cosX;
        const p = 3.2 / (3.2 - z2);
        return [cx + x1 * scale * p, cy - y2 * scale * p, z2, x1, y2];
      }

      // Sade döner tabla halkası
      ctx.strokeStyle = "rgba(239, 236, 230, 0.08)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 48; i++) {
        const a = (i / 48) * Math.PI * 2;
        const [px, py] = proj(Math.cos(a) * 1.25, -1.05, Math.sin(a) * 1.25);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();

      const mesh = state.mesh;
      if (!mesh) return;
      const pv = new Array(mesh.vertsCount);
      for (let i = 0; i < mesh.vertsCount; i++) {
        pv[i] = proj(mesh.pos[i * 3], mesh.pos[i * 3 + 1], mesh.pos[i * 3 + 2]);
      }

      const tris = [];
      for (let i = 0; i < mesh.faces.length; i++) {
        const [ia, ib, ic] = mesh.faces[i];
        const a = pv[ia], b = pv[ib], c = pv[ic];
        const ux = b[3] - a[3], uy = b[4] - a[4], uz = b[2] - a[2];
        const vx = c[3] - a[3], vy = c[4] - a[4], vz = c[2] - a[2];
        const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        if (nz <= 0 && state.inspectorMode !== "wire") continue;
        const nl = Math.hypot(nx, ny, nz) || 1;
        tris.push({ a, b, c, z: (a[2] + b[2] + c[2]) / 3, nx: nx / nl, ny: ny / nl, nz: nz / nl });
      }
      tris.sort((u, v) => u.z - v.z);

      for (const f of tris) {
        const ndotl = Math.max(0.16, f.nx * -0.45 + f.ny * 0.62 + f.nz * 0.65);
        ctx.beginPath();
        ctx.moveTo(f.a[0], f.a[1]);
        ctx.lineTo(f.b[0], f.b[1]);
        ctx.lineTo(f.c[0], f.c[1]);
        ctx.closePath();

        if (state.inspectorMode === "pbr") {
          const lum = Math.round(64 + ndotl * 156);
          ctx.fillStyle = `rgb(${lum}, ${Math.round(lum * 0.97)}, ${Math.round(lum * 0.92)})`;
          ctx.fill();
        } else if (state.inspectorMode === "wire") {
          ctx.strokeStyle = "rgba(239, 236, 230, 0.55)";
          ctx.lineWidth = 1;
          ctx.stroke();
        } else if (state.inspectorMode === "uv") {
          const chk = (Math.floor((f.a[3] + 1) * 4) + Math.floor((f.a[4] + 1) * 4)) % 2 === 0;
          const base = chk ? 210 : 95;
          ctx.fillStyle = `rgb(${Math.round(base * ndotl)}, ${Math.round((base - 12) * ndotl)}, ${Math.round((base - 24) * ndotl)})`;
          ctx.fill();
        } else if (state.inspectorMode === "bone") {
          ctx.fillStyle = `rgba(220, 214, 204, ${(0.2 * ndotl).toFixed(2)})`;
          ctx.fill();
        } else if (state.inspectorMode === "print") {
          const s = Math.max(0, 1 - Math.abs(f.ny));
          ctx.fillStyle = `rgb(${Math.round((145 + s * 88) * ndotl)}, ${Math.round((188 - s * 82) * ndotl)}, ${Math.round((148 - s * 78) * ndotl)})`;
          ctx.fill();
        }
      }

      if (state.inspectorMode === "bone") {
        const joints = [[0,-0.75,0],[0,-0.15,0],[0,0.45,0],[0,0.85,0],[-0.45,0.35,0],[0.45,0.35,0]].map(
          ([x, y, z]) => proj(x, y, z)
        );
        ctx.strokeStyle = "#F2EFE9";
        ctx.lineWidth = 2.4;
        for (const [u, v] of [[0,1],[1,2],[2,3],[2,4],[2,5]]) {
          ctx.beginPath();
          ctx.moveTo(joints[u][0], joints[u][1]);
          ctx.lineTo(joints[v][0], joints[v][1]);
          ctx.stroke();
        }
        for (const j of joints) {
          ctx.fillStyle = "#E2B86B";
          ctx.beginPath();
          ctx.arc(j[0], j[1], 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    requestAnimationFrame(renderLoop);

    // Oluşturma İsteği
    const genBtn = document.getElementById("genBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl = document.getElementById("status");

    downloadBtn.onclick = () => {
      if (!state.lastGlbBlob) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(state.lastGlbBlob);
      a.download = "redis3d_model.glb";
      a.click();
    };

    genBtn.onclick = async () => {
      genBtn.disabled = true;
      genBtn.textContent = "Oluşturuluyor...";
      statusEl.textContent = "Üretiliyor...";

      try {
        const res = await fetch("/api/v1/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-Key": "redis3d-local-dev" },
          body: JSON.stringify({
            prompt: document.getElementById("prompt").value,
            image_b64: state.imageB64,
            candidates: state.candidates,
            nfe_steps: state.nfeSteps,
            patr_steps: state.proMode ? 6 : 2,
            retopo_quads: state.retopoQuads,
            auto_rig: state.autoRig,
            sym_lock: state.proMode,
          }),
        });
        if (!res.ok) {
          statusEl.textContent = `Hata: ${res.status}`;
          return;
        }
        const buf = await res.arrayBuffer();
        state.lastGlbBlob = new Blob([buf], { type: "model/gltf-binary" });
        downloadBtn.disabled = false;

        const parsed = parseGlbBuffer(buf);
        if (parsed) state.mesh = parsed;

        const ms = res.headers.get("X-Latency-Ms") || "?";
        statusEl.textContent = `Tamamlandı · ${ms} ms`;
      } catch (err) {
        statusEl.textContent = "Bağlantı hatası";
      } finally {
        genBtn.disabled = false;
        genBtn.textContent = "Oluştur";
      }
    };
  </script>
</body>
</html>
