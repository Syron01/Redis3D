[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axion3d-pro"
version = "0.1.0"
description = "AXION-3D PRO: ultra-light commercial local 3D foundation engine (sm_120, <=2GB VRAM)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11",
    "pynvml>=11.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["axion3d*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"