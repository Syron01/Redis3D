# Redis3D hardware contract (roadfinal.md §1) — measured on this machine
gpu:
  name: "NVIDIA GeForce RTX 5060 Laptop GPU"
  arch: blackwell_gb206
  capability: [12, 0]          # sm_120: dense mma.sync only, NO MoE/grouped FP4
  vram_total_mb: 8151
  cuda_cores: 3328
  tensor_cores: 104
  memory_bandwidth_gbs: 384
  l2_cache_mib: 32
cpu:
  model: "Intel Core i7-14650HX"
  physical_cores: 16
  logical_threads: 24
  worker_pool_cap: 16          # keep Windows + CUDA feed threads responsive
ram:
  total_gb: 32.0
  type: DDR5-5600
  optimizer_offload: pinned_cpu_adamw   # 0 MB GPU optimizer states
storage:
  model: "Crucial P310 1TB NVMe"
  shard_format: wov_v2_zstd
power:
  ac_enforced_limit_w: 115     # measured via nvmlDeviceGetEnforcedPowerLimit
  battery_default_limit_w: 50
  min_ac_power_w: 70           # warn below this
budget:
  inference_peak_vram_mb: 2048 # HARD assert, 0 MB shared spill
  inference_target_mb: [1200, 1750]
  training_vram_mb: 5325       # <= 5.2 GB activations+weights, CPU AdamW
  latency_target_s: [1.0, 3.0]
locale:
  encoding: utf-8              # everywhere, cp1254-safe
  paths: pathlib